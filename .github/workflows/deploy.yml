name: Deploy Worker
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: worker-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Check deployment credentials
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Worker was not deployed: add the CLOUDFLARE_API_TOKEN secret to the production environment or repository. See README.md#github-actions-setup."
            echo "### Deployment pending configuration" >> "$GITHUB_STEP_SUMMARY"
            echo "Checks passed, but the Worker was not deployed. Add the CLOUDFLARE_API_TOKEN secret, then rerun this workflow. See README.md#github-actions-setup." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.configured == 'true'
        run: npm run deploy -- --prebuilt --mode production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Verify live Worker
        if: steps.credentials.outputs.configured == 'true'
        run: npm run smoke
      - name: Record deployment
        if: steps.credentials.outputs.configured == 'true'
        run: |
          echo "### Worker deployed and verified" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: https://fetch-swedish-word-compounds.arthow4n.workers.dev" >> "$GITHUB_STEP_SUMMARY"
